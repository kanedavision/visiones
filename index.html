<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0">
<title>VISIÓNES</title>
<style>
  :root{
    --paper:#fdfdfd;
    --ink:#060606;
    --blood:#1a3cc4;
    --ash:rgba(25,56,138,0.62);
    --line: rgba(25,56,138,0.18);
  }

  *{margin:0; padding:0; box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight:500;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{background:var(--blood); color:var(--paper);}
  a{color:inherit; text-decoration:none;}

  .mono{
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight:500;
    letter-spacing:0.06em;
  }

  .title{
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight:900;
  }

  .hl{
    background:#E8EBF3;
    color:#19388A;
    padding:0.05em 0.28em;
    box-decoration-break:clone;
    -webkit-box-decoration-break:clone;
    display:inline;
    font-weight:inherit;
  }

  a:focus-visible, button:focus-visible{
    outline:2px solid var(--blood);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  /* ---------- NAV ---------- */
  .nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:100;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:26px 44px;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    background:linear-gradient(var(--paper) 40%, transparent);
  }
  .nav-mark img{
    height:41px;
    width:auto;
    display:block;
    justify-self:center;
  }
  .nav-left{
    display:flex;
    gap:26px;
    justify-self:start;
  }
  .nav-right{
    display:flex;
    justify-self:end;
  }
  .nav-links a{opacity:0.7; transition:opacity .2s, color .2s;}
  .nav-links a:hover{opacity:1; color:var(--blood);}
  @media(max-width:640px){
    .nav{padding:20px 22px;}
    .nav-left, .nav-right{gap:16px; font-size:10.5px;}
  }

  /* ---------- INTRO ---------- */
<h1> #+*! </h1>
<iframe width="560" height="315" src="https://www.youtube.com/embed/bfXGzxbax9M?si=A7jWiDGBTCMgBGDg&amp;controls=0" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

  .footer-bottom{
    max-width:1100px;
    margin:80px auto 0;
    padding:26px 44px 40px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    font-size:11px;
    color:#E8EBF3;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .footer-links{display:flex; gap:20px;}
  .footer-links a{opacity:0.75; transition:opacity .2s, color .2s;}
  .footer-links a:hover{opacity:1; color:var(--blood);}
</style>
</head>
<body>


</body>
</html>
